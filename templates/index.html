<!DOCTYPE html>
<html>
<head>
    <title>Weather Viewer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='AppStyle.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

    <div id="topbar">
        <img src="/static/top-image.jpg" id="topbar-img">
        <div id="topbar-content">
            <h2>My Project</h2>
        </div>
    </div>

    <div id="center">
        <h2 id="info">Click the world map</h2>
        <img id="map" src="/static/unhovered.webp">

        <img id="preview" style="max-width:320px; max-height;200px; margin-top:10px; display:none;">
    </div>

    <div id="leafletOverlay"></div>

    <div id="playerContainer">

        <canvas id="pipCanvas"></canvas>

        <video id="pipVideo"
               autoplay
               muted
               playsinline
               controlslist="nofullscreen nodownload noplaybackrate noremoteplayback">
        </video>

        <div id="weatherOverlay"></div>

    </div>
    <div id="weatherBox" class="weather-box">
        <div id="weatherText">Weather: —</div>
    </div>

    <div id="footer">
        All APIs used are the property of their respective owners.
    </div>

    <button id="debugWeather">
        Debug Weather
    </button>

    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
