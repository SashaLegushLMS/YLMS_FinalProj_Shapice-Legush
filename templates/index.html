<!DOCTYPE html>
<html>
<head>
    <title>World Map Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='AppStyle.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

    <!-- TOP BAR -->
    <div id="topbar">
        <img src="/static/top-image.jpg" id="topbar-img">
        <div id="topbar-content">
            <h2>My Project</h2>
        </div>
    </div>

    <!-- CENTER -->
    <div id="center">
        <h2 id="info">Click the world map</h2>
        <img id="map" src="/static/unhovered.webp">
    </div>

    <div id="leafletOverlay"></div>

    <!-- MINI PLAYER -->
    <img id="bg" src="">

    <!-- MENU -->
    <div id="menu">
        <div id="close">✖</div>

        <input id="search" placeholder="Search country...">

        <div id="list">
            {% for name in countries.keys() %}
            <div class="country" onclick="selectCountry('{{ name }}')">
                {{ name }}
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer">
        All APIs used are the property of their respective owners.
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <script>
        const mapImg = document.getElementById("map");
        const overlay = document.getElementById("leafletOverlay");

        // open overlay on image click
        mapImg.addEventListener("click", () => {
            overlay.classList.add("active");

            // create Leaflet map only once
            if (!window.leafletMap) {
                window.leafletMap = L.map('leafletOverlay').setView([20, 0], 2);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 6,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(window.leafletMap);

                // click on real map
                window.leafletMap.on("click", async (e) => {
                    const { lat, lng } = e.latlng;

                    console.log("Clicked:", lat, lng);

                    // send to backend (you can improve later)
                    const res = await fetch("/get_country", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ lat, lng })
                    });

                    const data = await res.json();

                    document.getElementById("info").textContent =
                        "Capital: " + data.capital;

                    const player = document.getElementById("bg");
                    player.src = data.image;
                    player.style.display = "block";

                    overlay.classList.remove("active");
                });
            }

            setTimeout(() => window.leafletMap.invalidateSize(), 100);
        });
    </script>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</body>
</html>
